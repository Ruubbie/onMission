# hesent.me: the public supporter site (Ruben's zine). Static files in ./public, plus a tiny
# Worker that sends the bare domain to /nl/ or /en/. Separate from the sync API (../app/server).
name = "hesent-site"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html"]

