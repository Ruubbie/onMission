# Builds the iPhone app on GitHub's Macs. Copy this file to .github/workflows/ios.yml in your repo.
#
# Every push: compiles the app for the iPhone simulator (no Apple account needed). This is how you
# find out the code builds without owning a Mac.
# Manual run ("Run workflow" in the Actions tab) with the secrets below: signs the app and uploads it
# to TestFlight, so it appears in the TestFlight app on your iPhone.
#
# Secrets (repo Settings > Secrets and variables > Actions), from App Store Connect > Users and Access >
# Integrations > App Store Connect API (role: App Manager):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full text of the .p8 file), APPLE_TEAM_ID
name: iOS app

on:
  push:
    paths: ["missions/app/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight"
        type: boolean
        default: true

defaults:
  run:
    working-directory: missions/app/ios   # change if the ios folder sits elsewhere in your repo

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: App name from the design tokens
        run: echo "APP_NAME=$(python3 -c 'import json; print(json.load(open("../design/tokens.json"))["brand"]["appName"])')" >> "$GITHUB_ENV"
      - name: Build for the simulator
        run: |
          xcodebuild -project OnMission.xcodeproj -scheme OnMission \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && ok=0 || ok=$?
          grep -E "error:|warning: .*(Sendable|actor)" build.log | sort -u | head -n 300 || true
          tail -n 60 build.log
          exit $ok

  ipa:
    # Unsigned .ipa for sideloading (Sideloadly / AltStore sign it with your own Apple ID).
    # Every push to main replaces the "latest" release with a fresh OnMission.ipa.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: App name from the design tokens
        run: echo "APP_NAME=$(python3 -c 'import json; print(json.load(open("../design/tokens.json"))["brand"]["appName"])')" >> "$GITHUB_ENV"
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project OnMission.xcodeproj -scheme OnMission -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            APP_NAME="$APP_NAME" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ipa.log 2>&1 && ok=0 || ok=$?
          grep -E "error:" ipa.log | sort -u | head -n 100 || true
          tail -n 20 ipa.log
          exit $ok
      - name: Package OnMission.ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OnMission.app Payload/
          # Ad-hoc signature so sideloading tools (Impactor, Sideloadly, AltStore) see a normal app;
          # they re-sign it with your Apple ID anyway.
          codesign --force --sign - --timestamp=none Payload/OnMission.app
          codesign -dv Payload/OnMission.app 2>&1 | head -n 5
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' Payload/OnMission.app/Info.plist || true
          ls Payload/OnMission.app
          zip -qry -X OnMission.ipa Payload
          ls -lh OnMission.ipa
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OnMission.ipa --title "On Mission (build ${{ github.run_number }})" \
            --notes "Unsigned iPhone app for sideloading with Sideloadly or AltStore. Built from ${GITHUB_SHA::7}." --latest

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: App name from the design tokens
        run: echo "APP_NAME=$(python3 -c 'import json; print(json.load(open("../design/tokens.json"))["brand"]["appName"])')" >> "$GITHUB_ENV"
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (signed automatically with your developer account)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project OnMission.xcodeproj -scheme OnMission -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OnMission.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" APP_NAME="$APP_NAME" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/OnMission.xcarchive -exportOptionsPlist export.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
