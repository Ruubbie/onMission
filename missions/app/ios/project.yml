# Generates OnMission.xcodeproj. On a Mac:  brew install xcodegen  then run  xcodegen  in this folder.
name: OnMission
options:
  bundleIdPrefix: nl.rubenonmission
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # pick your Apple ID under Signing & Capabilities (or set your Team ID here)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  OnMission:
    type: application
    platform: iOS
    sources:
      - path: OnMission/Shared
      - path: OnMission/iOS
      - path: OnMission/Resources
        buildPhase: resources   # copied flat into the app: seed data, guides, fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.rubenonmission.onmission
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The home-screen name. CI overrides APP_NAME with brand.appName from design/tokens.json.
        APP_NAME: OnMission
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_NAME)
        INFOPLIST_KEY_NSCameraUsageDescription: Scan documents into your vault.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
