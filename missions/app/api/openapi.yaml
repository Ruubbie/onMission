openapi: 3.1.0
info:
  title: Mission App API
  version: 1.0.0
  summary: Sync and file storage for Ruben's mission-prep apps (iPhone + Windows helper).
  description: |
    One backend for the iPhone app and the Windows desktop helper. Everything the apps
    store (tasks, checklists, support partners, budget, sell list, packing, notes, documents,
    settings) is a **record** in a **collection**. Files (passport scans, tickets, photos)
    are uploaded separately and referenced from a `documents` record (or any record's `fileIds`).

    ## Offline-first sync, in short
    1. Clients keep a local database (SQLite / Core Data / SwiftData) and work fully offline.
    2. Every record has a client-generated lowercase UUID `id`, and the client sets
       `updatedAt` (ISO 8601 UTC, ms) on every local change. Deleting = set `deletedAt`
       (and bump `updatedAt`); never hard-delete locally until the server has the tombstone.
    3. To sync, call `POST /v1/sync` with your unsent local changes and the `cursor` you got
       last time (omit it the first time). The server applies your changes, then returns
       everything that changed on the server since your cursor (including your own accepted
       changes, so you can store `seq`), plus a new `cursor`. Repeat while `hasMore` is true.
    4. Conflicts: **last writer wins per record**, decided by `updatedAt`. If the server copy is
       newer, your change is listed in `rejected` with the server's current record; replace your
       local copy with it. A `updatedAt` more than 5 minutes in the future is clamped to server time.
    5. Tombstones (`deletedAt` set) are kept for 180 days, so a device that has not synced
       for longer must do a full resync (drop the cursor). The server signals this with
       `resetRequired: true`.

    ## Linking ("smart links")
    Any record's `data` may contain `links: [{collection, id}]` to point at other records,
    e.g. a task "Scan passport" links to the `documents` record of the passport, a partner
    links to the notes of your last conversation. Links are not enforced by the server; clients
    should show a link to a deleted/missing record as "removed".

    ## Auth
    Bearer token per device. Get one with `POST /v1/auth/login`. Store it in the Keychain
    (iOS) or Windows Credential Manager. Tokens do not expire; revoke a lost device with
    `DELETE /v1/devices/{id}`. The very first account is created once with
    `POST /v1/auth/setup` using the server's setup secret.

    ## Conventions
    - All JSON. Times are ISO 8601 UTC strings with milliseconds, e.g. `2026-10-08T19:00:00.000Z`.
      Dates without time (due dates) are `YYYY-MM-DD`.
    - Money is an integer in **cents** plus an ISO 4217 `currency` (`EUR` or `NZD` mostly).
    - Unknown fields inside `data` are stored and returned untouched, so newer app versions
      can add fields without a server change. Clients must ignore fields they don't know.
    - Errors: `{ "error": { "code": "string", "message": "human readable" } }`.
servers:
  - url: https://api.hesent.me
    description: Production (Ruben's own server)
  - url: http://localhost:8787
    description: Local dev (`npx wrangler dev`)
security:
  - bearer: []
tags:
  - name: auth
  - name: sync
  - name: records
  - name: files
  - name: misc
  - name: public
    description: No login. Used by the public website hesent.me.

paths:
  /v1/health:
    get:
      tags: [misc]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, version, time]
                properties:
                  ok: { type: boolean }
                  version: { type: string, example: "1.0.0" }
                  time: { $ref: "#/components/schemas/Timestamp" }

  /v1/auth/setup:
    post:
      tags: [auth]
      security: []
      summary: Create the first (owner) account. Only works while no account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setupSecret, email, password, name]
              properties:
                setupSecret: { type: string, description: "The SETUP_SECRET configured on the server" }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                name: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: An account already exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in on a device and get a device token
      description: Max 10 failed attempts per email per 15 minutes, then 429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device: { $ref: "#/components/schemas/DeviceInfo" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the token used for this request
      responses:
        "204": { description: Logged out }

  /v1/auth/password:
    post:
      tags: [auth]
      summary: Change password. Other devices stay logged in unless revokeOthers is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
                revokeOthers: { type: boolean, default: false }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me:
    get:
      tags: [auth]
      summary: Current user, space and device
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user, space, device]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  space: { $ref: "#/components/schemas/Space" }
                  device: { $ref: "#/components/schemas/Device" }

  /v1/devices:
    get:
      tags: [auth]
      summary: List logged-in devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/Device" } }

  /v1/devices/{deviceId}:
    delete:
      tags: [auth]
      summary: Revoke a device (lost phone, old laptop)
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sync:
    post:
      tags: [sync]
      summary: Push local changes and pull server changes in one call
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
            example:
              cursor: "1042"
              changes:
                - id: "6f1c2b3a-9d7e-4c1a-8b2f-0a1b2c3d4e5f"
                  collection: tasks
                  updatedAt: "2026-10-08T19:00:00.000Z"
                  deletedAt: null
                  data: { title: "Apply for Working Holiday Visa", area: visa, status: todo, dueDate: "2026-10-20" }
      responses:
        "200":
          description: Applied and pulled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/records/{collection}:
    get:
      tags: [records]
      summary: List live records of one collection (no sync bookkeeping; handy for scripts)
      parameters:
        - { name: collection, in: path, required: true, schema: { $ref: "#/components/schemas/Collection" } }
        - { name: includeDeleted, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records: { type: array, items: { $ref: "#/components/schemas/Record" } }

  /v1/records/{collection}/{id}:
    parameters:
      - { name: collection, in: path, required: true, schema: { $ref: "#/components/schemas/Collection" } }
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    get:
      tags: [records]
      summary: Get one record (also returns tombstones)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [records]
      summary: Create or replace one record (same last-writer-wins rule as sync)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                updatedAt: { $ref: "#/components/schemas/Timestamp" }
                deletedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
                data: { type: object, additionalProperties: true }
      responses:
        "200": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } } }
        "409": { description: Server copy is newer; body is the server copy, content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } } }
    delete:
      tags: [records]
      summary: Soft-delete (writes a tombstone)
      responses:
        "200": { description: Tombstone, content: { application/json: { schema: { $ref: "#/components/schemas/Record" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/files/{fileId}:
    parameters:
      - { name: fileId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    put:
      tags: [files]
      summary: Upload a file (raw bytes as the body). Idempotent; re-upload replaces.
      description: |
        Max 50 MB. Send the real `Content-Type`. The optional `X-File-Name` header is stored
        (percent-encode non-ASCII). Upload the file first, then sync a `documents` record with
        this `fileId`. The client generates `fileId` (UUID), so it can create the record offline
        and upload later.
      parameters:
        - { name: X-File-Name, in: header, schema: { type: string } }
        - { name: X-Sha256, in: header, description: "Optional hex SHA-256 of the body; server rejects on mismatch", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          "*/*": { schema: { type: string, format: binary } }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/FileInfo" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [files]
      summary: Download a file
      responses:
        "200":
          description: The bytes, with Content-Type, ETag (sha256) and Content-Disposition
          content:
            "*/*": { schema: { type: string, format: binary } }
        "304": { description: Not modified (If-None-Match matched) }
        "404": { $ref: "#/components/responses/Error" }
    head:
      tags: [files]
      summary: Check whether a file exists (to decide if an upload is still needed)
      responses:
        "200": { description: Exists; headers as GET }
        "404": { description: Not uploaded }
    delete:
      tags: [files]
      summary: Delete a file permanently
      responses:
        "204": { description: Deleted }

  /v1/files:
    get:
      tags: [files]
      summary: List uploaded files (metadata only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files: { type: array, items: { $ref: "#/components/schemas/FileInfo" } }

  /v1/summary:
    get:
      tags: [misc]
      summary: Dashboard numbers computed on the server (for widgets and the desktop home screen)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }

  /v1/export:
    get:
      tags: [misc]
      summary: Full JSON backup of all records (files listed by metadata, not inlined)
      responses:
        "200":
          description: Backup
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, records, files]
                properties:
                  exportedAt: { $ref: "#/components/schemas/Timestamp" }
                  records: { type: array, items: { $ref: "#/components/schemas/Record" } }
                  files: { type: array, items: { $ref: "#/components/schemas/FileInfo" } }

  /v1/public/summary:
    get:
      tags: [public]
      summary: What the public website (hesent.me) may show. No login.
      description: |
        Only what Ruben chose to share: the departure date, monthly support as a percentage
        (never amounts or names), and prayer notes with `public: true`. Open prayers come first
        (by `order`, then newest), then answered ones (newest first); at most 12 of each.
        `letters`: the newest 5 online letters in `lang` (see /v1/public/letters), with the opening
        paragraph of the body as plain text. Cached for 5 minutes.
      security: []
      parameters:
        - name: tz
          in: query
          schema: { type: string, default: Europe/Amsterdam }
          description: IANA time zone that decides "today"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSummary" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/public/letters:
    get:
      tags: [public]
      summary: Every letter on hesent.me in one language, newest first. No login.
      description: |
        A newsletter is online when its status is `sent` and it has `public: true` (or an https `webUrl`).
        It is listed in a language once it has a title in that language (`title` for nl, `titleEn` for en).
        The list has no bodies; `photo` is the lead photo (the cover, for an arranged letter). Cached for 5 minutes.
        One letter (/v1/public/letters/{key}) also carries `sections` and `layout` ({ cover, columns, footer }) when it is
        arranged and its body still matches its sections in that language.
      security: []
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [letters]
                properties:
                  letters: { type: array, items: { $ref: "#/components/schemas/PublicLetter" } }

  /v1/public/letters/{key}:
    get:
      tags: [public]
      summary: One whole letter, with the newer and older one. No login.
      description: |
        Only the part of `key` before the first dash is looked up (the issue number, or the first 8
        characters of the id when there is no number), so old links keep working after a title change.
      security: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [letter, newer, older]
                properties:
                  letter: { $ref: "#/components/schemas/PublicLetter" }
                  newer: { oneOf: [{ $ref: "#/components/schemas/PublicLetterLink" }, { type: "null" }] }
                  older: { oneOf: [{ $ref: "#/components/schemas/PublicLetterLink" }, { type: "null" }] }
                  support:
                    type: object
                    description: "For the funds piece: the monthly support as a percentage of the target, as in /v1/public/summary"
                    properties:
                      percentOfTarget: { type: [integer, "null"] }
        "404": { $ref: "#/components/responses/Error" }

  /v1/public/photos/{id}:
    get:
      tags: [public]
      summary: A photo used by an online letter. No login.
      description: Only files listed in `photos` of an online newsletter, and only images. Cached for a day.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
      responses:
        "200":
          description: The image
          content:
            image/*: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }

  /v1/public/subscribe:
    post:
      tags: [public]
      summary: Newsletter sign-up from hesent.me. No login.
      description: |
        Creates a `partners` record on stage `idea` ("On my list") with `newsletter: true` and the tag
        `website`, or switches `newsletter` on for an existing partner with the same email (name and stage
        stay as they are). `lang` is the language the reader wants the letters in; it is kept as the tag
        `lang-nl` or `lang-en` (replacing an earlier one). The answer is the same whether or not the email was known.
        A filled-in `website` field (a hidden bot trap) gets a 201 and stores nothing.
        Rate limit: 5 sign-ups per IP per hour, 200 in total per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, maxLength: 200 }
                lang: { type: string, enum: [nl, en], default: nl, description: "Language for the letters" }
                website: { type: string, description: "Bot trap: leave empty" }
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/public/message:
    post:
      tags: [public]
      summary: A message to Ruben from the giving page on hesent.me. No login.
      description: |
        For someone who gives (or thinks about it) and wants to get to know Ruben. The message lands on the
        `partners` record with the same email, or on a new one on stage `idea` ("On my list") with the tags
        `website` and `lang-nl`/`lang-en`. It is added to the top of `siteMessages` (the newest 20 are kept) and,
        with the date, to the top of `notes`; `replyWaiting` is set to true, `nextFollowUp` to today (an earlier
        planned day stays), `nextStep` to "Reply to their message from hesent.me" and `lastContactAt` to today.
        An existing partner keeps their name, stage and newsletter setting.
        A filled-in `website` field (a hidden bot trap) gets a 201 and stores nothing.
        Rate limit: 5 messages per IP per hour; 200 public sign-ups and messages together per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 2000, description: "Line breaks are kept; more than one empty line in a row becomes one" }
                lang: { type: string, enum: [nl, en], default: nl, description: "The language of the page it was sent from" }
                website: { type: string, description: "Bot trap: leave empty" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Device token from /v1/auth/login

  parameters:
    Lang:
      name: lang
      in: query
      schema: { type: string, enum: [nl, en], default: nl }
      description: The language of the letters

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Session:
      description: Logged in
      content:
        application/json:
          schema:
            type: object
            required: [token, user, space, device]
            properties:
              token: { type: string, description: "Bearer token. Shown once; store it securely." }
              user: { $ref: "#/components/schemas/User" }
              space: { $ref: "#/components/schemas/Space" }
              device: { $ref: "#/components/schemas/Device" }

  schemas:
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Lowercase UUID, generated by the client
    Timestamp:
      type: string
      format: date-time
      example: "2026-10-08T19:00:00.000Z"
    Date:
      type: string
      format: date
      example: "2027-01-05"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: unauthorized }
            message: { type: string }

    DeviceInfo:
      type: object
      properties:
        name: { type: string, example: "Ruben's iPhone" }
        platform: { type: string, enum: [ios, windows, web, other] }
        appVersion: { type: string }
    Device:
      type: object
      required: [id, name, platform, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        appVersion: { type: [string, "null"] }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        lastSeenAt: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: "True for the device making the request" }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
    Space:
      type: object
      description: |
        The shared container all records and files live in. Today every user has one space.
        Later a space can be shared (e.g. with a mentor or parent); the sync API will not change.
      required: [id, name, role]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, editor, viewer] }

    Collection:
      type: string
      enum: [tasks, checklists, partners, gifts, budget, sellItems, packing, notes, documents, contacts, newsletters, settings]

    Record:
      type: object
      description: Envelope for every stored object. `data` holds the collection-specific fields.
      required: [id, collection, updatedAt, data]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        collection: { $ref: "#/components/schemas/Collection" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        updatedAt: { $ref: "#/components/schemas/Timestamp" }
        deletedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        seq: { type: integer, description: "Server-assigned change number (read-only)" }
        updatedBy: { type: [string, "null"], description: "Device id that wrote it last (read-only)" }
        data:
          description: One of the collection schemas below; max 256 KB as JSON.
          oneOf:
            - $ref: "#/components/schemas/Task"
            - $ref: "#/components/schemas/Checklist"
            - $ref: "#/components/schemas/Partner"
            - $ref: "#/components/schemas/BudgetEntry"
            - $ref: "#/components/schemas/SellItem"
            - $ref: "#/components/schemas/PackingItem"
            - $ref: "#/components/schemas/Note"
            - $ref: "#/components/schemas/Document"
            - $ref: "#/components/schemas/Contact"
            - $ref: "#/components/schemas/Gift"
            - $ref: "#/components/schemas/Newsletter"
            - $ref: "#/components/schemas/Setting"

    Link:
      type: object
      required: [collection, id]
      properties:
        collection: { $ref: "#/components/schemas/Collection" }
        id: { $ref: "#/components/schemas/Uuid" }
        label: { type: string, description: Optional text shown on the link chip }
    Common:
      type: object
      description: Optional fields every collection may use
      properties:
        links: { type: array, items: { $ref: "#/components/schemas/Link" } }
        tags: { type: array, items: { type: string } }
        fileIds: { type: array, items: { $ref: "#/components/schemas/Uuid" }, description: "Attached files (photos, scans)" }
        order: { type: number, description: "Manual sort position within a list" }
    Area:
      type: string
      description: Life area used to group tasks, notes and checklists
      enum: [visa, admin, finance, support, newsletter, selling, packing, housing, health, insurance, church, travel, ywam, personal, other]

    Task:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [title, status]
          properties:
            title: { type: string }
            notes: { type: string, description: Markdown }
            status: { type: string, enum: [todo, doing, waiting, done, skipped] }
            area: { $ref: "#/components/schemas/Area" }
            priority: { type: string, enum: [low, normal, high], default: normal }
            dueDate: { $ref: "#/components/schemas/Date" }
            remindAt: { $ref: "#/components/schemas/Timestamp" }
            completedAt: { $ref: "#/components/schemas/Timestamp" }
            checklistId: { $ref: "#/components/schemas/Uuid", description: "Checklist this task belongs to" }
            parentTaskId: { $ref: "#/components/schemas/Uuid", description: "For subtasks" }
            waitingOn: { type: string, description: "Who/what you're waiting on when status = waiting" }
            sourceUrl: { type: string, description: "Official page to re-check before acting" }
    Checklist:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [title]
          properties:
            title: { type: string }
            description: { type: string }
            area: { $ref: "#/components/schemas/Area" }
            phase: { type: string, enum: [now, before-departure, departure-week, arrival, ongoing], description: "When in the timeline it applies" }
            archived: { type: boolean }
    Partner:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [name, stage]
          properties:
            name: { type: string }
            contactId: { $ref: "#/components/schemas/Uuid" }
            email: { type: string }
            phone: { type: string }
            church: { type: string }
            stage: { type: string, enum: [idea, to-ask, asked, thinking, committed, giving, declined, paused] }
            monthlyCents: { type: integer, description: "Committed monthly gift" }
            oneOffCents: { type: integer }
            currency: { type: string, default: EUR }
            startDate: { $ref: "#/components/schemas/Date" }
            prayer: { type: boolean, description: "Prays regularly" }
            newsletter: { type: boolean, description: "Signed up for the newsletter" }
            lastContactAt: { $ref: "#/components/schemas/Date" }
            nextFollowUp: { $ref: "#/components/schemas/Date" }
            thankedAt: { $ref: "#/components/schemas/Date" }
            notes: { type: string }
            replyWaiting: { type: boolean, description: "A message from hesent.me waits for an answer. Set by the server; the apps clear it when Ruben has replied" }
            siteMessages:
              type: array
              description: Messages sent from the giving page on hesent.me, newest first (at most 20). Written by the server only; the apps send them back untouched.
              items:
                type: object
                required: [at, name, text]
                properties:
                  at: { type: string, format: date-time }
                  name: { type: string, description: "The name they filled in with this message" }
                  text: { type: string }
                  lang: { type: string, enum: [nl, en] }
    BudgetEntry:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [kind, label, amountCents, currency]
          properties:
            kind: { type: string, enum: [income, expense, saving] }
            label: { type: string }
            category: { type: string, example: "staff fee" }
            amountCents: { type: integer }
            currency: { type: string, example: NZD }
            recurrence: { type: string, enum: [once, monthly, yearly], default: once }
            date: { $ref: "#/components/schemas/Date" }
            phase: { type: string, enum: [setup, monthly], description: "One-off setup cost before leaving vs. monthly running cost" }
            paid: { type: boolean }
            notes: { type: string }
    SellItem:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [name, status]
          properties:
            name: { type: string }
            status: { type: string, enum: [decide, to-list, listed, reserved, sold, given-away, keep, store] }
            askingCents: { type: integer }
            soldCents: { type: integer }
            currency: { type: string, default: EUR }
            platform: { type: string, example: Marktplaats }
            listingUrl: { type: string }
            buyer: { type: string }
            pickupDate: { $ref: "#/components/schemas/Date" }
            location: { type: string, description: "Where it is now (room, parents' attic)" }
            notes: { type: string }
    PackingItem:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [name]
          properties:
            name: { type: string }
            bag: { type: string, enum: [checked, carry-on, personal, ship, buy-there, leave], default: checked }
            category: { type: string, example: clothes }
            quantity: { type: integer, default: 1 }
            packed: { type: boolean, default: false }
            weightGrams: { type: integer }
            notes: { type: string }
    Note:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [title]
          properties:
            title: { type: string }
            body: { type: string, description: Markdown }
            area: { $ref: "#/components/schemas/Area" }
            pinned: { type: boolean }
            kind: { type: string, enum: [note, prayer, journal, meeting, idea], default: note }
            answeredAt: { $ref: "#/components/schemas/Date", description: "For prayer notes" }
            public: { type: boolean, default: false, description: "Prayer notes only: show it on hesent.me (GET /v1/public/summary shows the title, never the body)" }
    Document:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          description: An important document you must not lose. The file itself lives at /v1/files/{fileId}.
          required: [title, kind]
          properties:
            title: { type: string, example: "Passport" }
            kind: { type: string, enum: [passport, visa, insurance, ticket, id, bank, medical, diploma, reference, contract, receipt, letter, other] }
            fileId: { $ref: "#/components/schemas/Uuid" }
            fileName: { type: string }
            mimeType: { type: string }
            sizeBytes: { type: integer }
            sha256: { type: string }
            number: { type: string, description: "Document number (sensitive)" }
            issuedAt: { $ref: "#/components/schemas/Date" }
            expiresAt: { $ref: "#/components/schemas/Date" }
            offline: { type: boolean, description: "Keep a copy on every device (for no-signal moments at the border)" }
            notes: { type: string }
    Contact:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [name]
          properties:
            name: { type: string }
            role: { type: string, example: "YWAM Queenstown staff coordinator" }
            organisation: { type: string }
            email: { type: string }
            phone: { type: string }
            address: { type: string }
            notes: { type: string }
    Gift:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          description: A gift actually received (for thank-yous and the real monthly total)
          required: [amountCents, currency, date]
          properties:
            partnerId: { $ref: "#/components/schemas/Uuid" }
            amountCents: { type: integer }
            currency: { type: string, default: EUR }
            date: { $ref: "#/components/schemas/Date" }
            recurring: { type: boolean }
            via: { type: string, example: "ANBI / bank transfer" }
            thankedAt: { $ref: "#/components/schemas/Date" }
            notes: { type: string }
    Newsletter:
      allOf:
        - $ref: "#/components/schemas/Common"
        - type: object
          required: [title, status]
          properties:
            title: { type: string }
            number: { type: integer }
            status: { type: string, enum: [idea, draft, ready, sent] }
            plannedDate: { $ref: "#/components/schemas/Date" }
            sentAt: { $ref: "#/components/schemas/Timestamp" }
            body: { type: string, description: "Markdown, in Dutch. ## starts a section" }
            webUrl: { type: string }
            notes: { type: string }
            public: { type: boolean, description: "Show on hesent.me once sent" }
            place: { type: string, example: "Queenstown, NZ" }
            subtitle: { type: string }
            note: { type: string, description: "A short side note or quote, placed beside a photo" }
            nextTime: { type: string, description: "What the next letter is about" }
            funds: { type: string, description: "Optional: Ruben's own line about the support, on the funds piece (a standard line otherwise)" }
            prayers: { type: array, items: { type: string } }
            titleEn: { type: string }
            subtitleEn: { type: string }
            bodyEn: { type: string, description: "Markdown, in English" }
            noteEn: { type: string }
            nextTimeEn: { type: string }
            fundsEn: { type: string }
            prayersEn: { type: array, items: { type: string } }
            photos: { type: array, items: { $ref: "#/components/schemas/LetterPhoto" } }
            sections:
              type: array
              description: "The letter as sections (written in the web app). body and bodyEn are these joined as Markdown (## title, then the text); once a body no longer matches, that language is laid out automatically again"
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  title: { type: [string, "null"] }
                  titleEn: { type: [string, "null"] }
                  body: { type: string }
                  bodyEn: { type: string }
            layout:
              type: [object, "null"]
              description: "Where each piece goes on hesent.me (the web app Arrange page). Pieces are s:<section id>, p:<photo id>, prayers, note, next (next time and the sign-up) and funds (the support so far and Give). Pieces not named go where they would go by themselves (next and funds: the footer); pieces under off stay off the page. A layout without footer gets one, with next moved into it. Null: automatic, with next and funds in the footer"
              properties:
                cover: { type: [string, "null"], description: "The photo id that leads in the header" }
                columns: { type: array, maxItems: 3, items: { type: array, items: { type: string } } }
                footer: { type: array, items: { type: string }, description: "The pieces that close the letter, side by side under the columns" }
                off: { type: array, items: { type: string } }
    Setting:
      type: object
      description: |
        Key/value settings shared across devices. Use a fixed id per key so all devices write the same record
        (the `main` settings record uses id 60a98c2f-4004-58e7-bcc2-c88a62377933; see server README).
      required: [key]
      properties:
        key: { type: string, example: main }
        departureDate: { $ref: "#/components/schemas/Date" }
        supportTargetMonthlyCents: { type: integer, example: 100000 }
        supportMinimumMonthlyCents: { type: integer, example: 75000 }
        currency: { type: string, example: EUR }
        nzdPerEur: { type: number, example: 1.85 }
        givingIban: { type: [string, "null"], description: "Shown on hesent.me under Give (GET /v1/public/summary). Empty: the site says the details follow soon." }
        givingHolder: { type: [string, "null"], description: "Account holder name shown with the IBAN" }
        givingReference: { type: [string, "null"], description: "Reference to put on the transfer" }
        givingUrl: { type: [string, "null"], description: "https link to give online; anything else is not shown" }
        value: { description: "Free value for other keys" }

    SyncRequest:
      type: object
      required: [changes]
      properties:
        cursor: { type: [string, "null"], description: "From the previous SyncResponse; omit/null for a full download" }
        changes:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, collection, updatedAt, data]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              collection: { $ref: "#/components/schemas/Collection" }
              updatedAt: { $ref: "#/components/schemas/Timestamp" }
              deletedAt: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
              data: { type: object, additionalProperties: true }
        limit: { type: integer, default: 500, maximum: 1000, description: "Max records to pull in this response" }
    SyncResponse:
      type: object
      required: [cursor, hasMore, changes, accepted, rejected, serverTime, resetRequired]
      properties:
        cursor: { type: string, description: "Store it; send it next time" }
        hasMore: { type: boolean, description: "Call again (with no changes) to pull the rest" }
        resetRequired: { type: boolean, description: "Your cursor is too old; drop it and resync from scratch" }
        serverTime: { $ref: "#/components/schemas/Timestamp" }
        changes: { type: array, items: { $ref: "#/components/schemas/Record" }, description: "Server records changed after your cursor, oldest first" }
        accepted:
          type: array
          description: Your changes that were stored, with their new seq
          items:
            type: object
            required: [id, seq]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              seq: { type: integer }
        rejected:
          type: array
          description: Your changes the server did not store
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string }
              reason: { type: string, enum: [stale, invalid, forbidden] }
              message: { type: string }
              current: { $ref: "#/components/schemas/Record", description: "Server copy (for stale)" }

    FileInfo:
      type: object
      required: [id, sizeBytes, mimeType, sha256, uploadedAt]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        fileName: { type: [string, "null"] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        uploadedAt: { $ref: "#/components/schemas/Timestamp" }

    Summary:
      type: object
      required: [today, tasks, support, selling, packing, documents]
      properties:
        today: { $ref: "#/components/schemas/Date" }
        departureDate: { type: [string, "null"], format: date }
        daysToDeparture: { type: [integer, "null"] }
        tasks:
          type: object
          properties:
            open: { type: integer }
            overdue: { type: integer }
            dueThisWeek: { type: integer }
            done: { type: integer }
            byArea: { type: object, additionalProperties: { type: integer }, description: "Open tasks per area" }
        support:
          type: object
          properties:
            committedMonthlyCents: { type: integer, description: "Partners in stage committed or giving (EUR)" }
            targetMonthlyCents: { type: [integer, "null"] }
            minimumMonthlyCents: { type: [integer, "null"] }
            percentOfTarget: { type: [number, "null"] }
            partners: { type: integer }
            followUpsDue: { type: integer }
        selling:
          type: object
          properties:
            itemsLeft: { type: integer }
            soldCents: { type: integer }
        packing:
          type: object
          properties:
            total: { type: integer }
            packed: { type: integer }
        documents:
          type: object
          properties:
            total: { type: integer }
            missingFile: { type: integer }
            expiringWithin180Days: { type: integer }

    PublicSummary:
      type: object
      required: [today, departureDate, daysToDeparture, support, giving, prayers, letters]
      properties:
        today: { $ref: "#/components/schemas/Date" }
        departureDate: { type: [string, "null"], format: date }
        daysToDeparture: { type: [integer, "null"], description: "Negative once departed" }
        support:
          type: object
          properties:
            percentOfTarget: { type: [integer, "null"], description: "Committed + giving partners as a whole percentage of the monthly target; null without a target" }
        giving:
          type: [object, "null"]
          description: "The main settings' giving fields; null while givingIban is empty"
          required: [iban, holder, reference, url]
          properties:
            iban: { type: string }
            holder: { type: [string, "null"] }
            reference: { type: [string, "null"] }
            url: { type: [string, "null"], description: "Only an https link" }
        prayers:
          type: array
          items:
            type: object
            required: [text, addedAt, answeredAt]
            properties:
              text: { type: string, description: "The prayer note title (max 280 characters)" }
              addedAt: { $ref: "#/components/schemas/Date" }
              answeredAt: { type: [string, "null"], format: date }
        letters:
          type: array
          items:
            type: object
            required: [key, title, sentAt, webUrl, excerpt]
            properties:
              key: { type: string, description: "The letter's address on hesent.me, for /v1/public/letters/{key}" }
              title: { type: string, description: "Max 140 characters" }
              sentAt: { $ref: "#/components/schemas/Date" }
              webUrl: { type: [string, "null"], description: "An outside copy of the letter (https), if there is one" }
              excerpt: { type: [string, "null"], description: "The first paragraph of the body as plain text, max ~320 characters" }
    PublicLetter:
      type: object
      description: One online letter in one language (see /v1/public/letters).
      required: [key, number, title, subtitle, place, sentAt, webUrl, excerpt]
      properties:
        key: { type: string, example: "3-een-nieuw-hoofdstuk" }
        number: { type: [integer, "null"] }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        place: { type: [string, "null"], example: "Queenstown, NZ" }
        sentAt: { $ref: "#/components/schemas/Date" }
        webUrl: { type: [string, "null"] }
        excerpt: { type: [string, "null"] }
        body: { type: string, description: "Markdown. Only on /v1/public/letters/{key}" }
        note: { type: [string, "null"], description: "A short side note or quote. Only on the letter itself" }
        nextTime: { type: [string, "null"], description: "What the next letter is about. Only on the letter itself" }
        funds: { type: [string, "null"], description: "Ruben's own line on the funds piece; null for the standard line. Only on the letter itself" }
        prayers: { type: array, items: { type: string }, description: "Only on the letter itself" }
        photos:
          type: array
          description: "Only on the letter itself; the first is the lead photo"
          items: { $ref: "#/components/schemas/PublicPhoto" }
        photo:
          description: "Only in the list: the lead photo"
          oneOf: [{ $ref: "#/components/schemas/PublicPhoto" }, { type: "null" }]
    PublicLetterLink:
      type: object
      required: [key, title, sentAt]
      properties:
        key: { type: string }
        title: { type: string }
        sentAt: { $ref: "#/components/schemas/Date" }
    PublicPhoto:
      type: object
      required: [url, caption, width, height]
      properties:
        url: { type: string, description: "Path on this server, /v1/public/photos/{id}" }
        caption: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    LetterPhoto:
      type: object
      description: A photo in a newsletter. The bytes are a file (PUT /v1/files/{id}).
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        caption: { type: string }
        captionEn: { type: string }
        width: { type: integer }
        height: { type: integer }
